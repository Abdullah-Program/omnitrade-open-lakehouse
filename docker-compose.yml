services:
  # ============================================================================
  # Apache Polaris Catalog (Official Iceberg REST Catalog)
  # ============================================================================
  polaris:
    image: apache/polaris:latest
    container_name: polaris-catalog
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      - POLARIS_BOOTSTRAP_PRINCIPAL_CLIENT_ID=polaris-admin
      - POLARIS_BOOTSTRAP_PRINCIPAL_CLIENT_SECRET=polaris-secret
      - POLARIS_REALM=default-realm
      - QUARKUS_HTTP_PORT=8181
      # Storage persistence configuration:
      # In production, backed by Aurora Postgres / DynamoDB.
      # For local sandbox/demo, in-memory or embedded H2 persistence is active.
      - QUARKUS_DATASOURCE_DB_KIND=h2
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakehouse-network

  # ============================================================================
  # Optional: Local MinIO S3 Mock (Zero-Cost local testing without AWS account)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: local-s3-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - lakehouse-network

networks:
  lakehouse-network:
    driver: bridge

volumes:
  minio_data:
